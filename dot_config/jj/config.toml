#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Chris Walker"
email = "chris.walker@tuta.io"

[ui]
editor = "kak"

[colors]
# General changes.
"timestamp" = "black"

"empty" = "red"

"description" = "blue"

"node immutable" = "blue"

"bookmark" = { fg = "magenta" }
"bookmarks" = { fg = "magenta" }


"author" = "black"
"committer" = "black"
# Output from jj st.
"diff removed" = { fg = "red", bg = "bright red" }
"diff added" = { fg = "green", bg = "bright green" }
"diff modified" = { fg = "blue", bg = "bright blue" }

# Output from jj diff.
"diff header" = { fg = "black" }
"diff removed token" = { fg = "red", bg = "bright red", underline = false }
"diff added token" = { fg = "green", bg = "bright green", underline = false }
"diff modified token" = { fg = "blue", bg = "bright blue", underline = false }

# Output of change/commit IDs.
"change_id prefix" = { fg = "green", bg = "bright green", underline = true }
"change_id rest" = { fg = "green", bg = "bright green" }
 
"commit_id prefix" = { fg = "blue", bg = "bright blue", underline = true }
"commit_id rest" = { fg = "blue", bg = "bright blue" }

# Working copy details.
"working_copy timestamp" = "black"
"working_copy empty" = { fg = "yellow", bg = "bright red" }

"working_copy description placeholder" = { fg = "red" }

"working_copy author" = "black"
"working_copy committer" = "black"

# Conflict.
"conflict" = { fg = "magenta", bg = "bright magenta" }
